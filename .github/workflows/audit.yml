name: Audit

on:
  pull_request:
  push:

jobs:
  audit:
    # Test against the announced Windows Server 2025 + Visual Studio 2026 runner image.
    runs-on: windows-2025-vs2026

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run Skill audit
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\audit-skills.ps1 -Mode CI

      - name: Check diff formatting
        shell: pwsh
        run: git diff --check
